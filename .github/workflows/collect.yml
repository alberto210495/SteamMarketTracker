name: Collect Steam data

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07 (top of the hour is the busiest slot on Actions)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to Discord before collecting"
        type: boolean
        default: false

# Never let two runs write the database at once.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read   # data goes to PostgreSQL, nothing is committed back
  actions: write   # for the keep-alive step below

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon PostgreSQL connection string
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }} # optional
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}  # optional: alerts
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}          # optional: Twitch viewers
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - name: Require DATABASE_URL
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::The DATABASE_URL repository secret is not set. Without it the run would write to a throwaway SQLite file and the data would be lost."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - run: pip install -r requirements-worker.txt

      - name: Test Discord alert
        if: inputs.test_alert
        run: python -m tracker test-alert

      - name: Collect
        run: python -m tracker collect

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API once a day resets that timer, no commits needed.
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
            echo "Schedule keep-alive sent"
          fi
