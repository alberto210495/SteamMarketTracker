# Games to track. Names are fetched from the Steam store automatically;
# the `note` field is just for you.
#
# country: storefront region used for prices (ISO 3166 code, e.g. us, gb, de, br)
country = "us"
# Extra storefront regions to compare prices with (snapshots only: sales, alerts and charts use `country`).
extra_countries = ["gb", "de", "br"]

# Discord alerts (sent only when the DISCORD_WEBHOOK_URL secret is set).
[alerts]
sales = true                  # sale started / ended / discount changed / base price changed
patches = true                # new patch notes posted on Steam
spikes = true                 # players far above the usual level for that hour of day
spike_ratio = 1.5             # ...at least 1.5x the usual level
spike_min_increase = 200      # ...and at least 200 more players than usual
drops = true                  # players far below the usual level (a collapse or a server outage)
drop_ratio = 0.5              # ...at most half the usual level
drop_min_decrease = 200       # ...and at least 200 fewer players than usual
daily_summary = true
daily_summary_hour_utc = 14   # 14:00 UTC = 8:00 in Central time (CST)
review_bombs = true           # a day with far more negative reviews than usual
review_bomb_min_negative = 30 # ...and at least this many negative reviews that day
price_targets = true          # a game drops to or below its target_price (set per game below)
all_time_lows = true          # a discounted game hits its lowest price since tracking began
atl_min_history_days = 30     # ...once there's at least 30 days of price history
weekly_digest = true          # biggest movers, active sales and patches of the past week
weekly_digest_weekday = 0     # 0 = Monday (sent at daily_summary_hour_utc)

# Per game, optional:
#   target_price = 9.99        alert when the price (in `country`'s currency) is at or below this
#   twitch_name = "..."        Twitch category name, if it differs from the Steam name

